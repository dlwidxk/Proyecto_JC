<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Fórmula Exacta</title>
    <!--Fuentes de Google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="admin-body">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="../../Recursos/images/logo.jpg" alt="Logo Fórmula Exacta">
                <h1>Panel de Administración</h1>
                <p>Acceso exclusivo para administradores</p>
            </div>

            <form id="login-form" class="formulario">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <p id="login-error" class="login-error" style="display: none;"></p>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <a href="../index.html" class="volver-sitio">← Volver al sitio web</a>
        </div>
    </div>

    <script src="../../JS/admin.js"></script>
</body>
</html>
