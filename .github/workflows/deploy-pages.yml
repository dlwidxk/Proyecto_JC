name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/react-app/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: Frontend/react-app
        run: npm ci

      - name: Comprobar la URL pública del backend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Configura VITE_API_URL en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Crear la versión de producción
        working-directory: Frontend/react-app
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/react-app/dist

      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
